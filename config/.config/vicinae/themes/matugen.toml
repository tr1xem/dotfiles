# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - Dark variant"
variant = "Dark"

# ============================================================================
# Core Colors
# ============================================================================
# Foundation colors that define the entire theme's personality
# Uses Material You's semantic color system for perfect harmony

[colors.core]
accent = "#d0bcfe"
accent_foreground = "#37265d"
background = "#141218"
foreground = "#e6e0e9"
secondary_background = "#211f24"
border = "#49454e"

# ============================================================================
# Window-Specific Colors
# ============================================================================
# Different borders for visual hierarchy between window types

[colors.main_window]
border = "#49454e"

[colors.settings_window]
border = "#948f99"

# ============================================================================
# Accent Colors
# ============================================================================
# Complete color palette using Material You's harmonious color generation
# Maps to various UI elements throughout Vicinae

[colors.accents]
blue = "#d0bcfe"
green = "#f0b8c7"
magenta = "#ccc2db"
orange = "#ffb4ab"
red = "#ffb4ab"
yellow = "#f0b8c7"
cyan = "#d0bcfe"
purple = "#ccc2db"

# ============================================================================
# Text Colors
# ============================================================================
# Semantic text colors for all states and contexts

[colors.text]
default = "#e6e0e9"
muted = "#cac4cf"
danger = "#ffb4ab"
success = "#f0b8c7"
placeholder = "#cac4cf"

[colors.text.selection]
background = "#d0bcfe"
foreground = "#37265d"

[colors.text.links]
default = "#d0bcfe"
visited = "#ccc2db"

# ============================================================================
# Input Fields
# ============================================================================
# Text inputs, search boxes with proper focus states

[colors.input]
border = "#948f99"
border_focus = "#d0bcfe"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================
# All button states with subtle hover effects and focus indicators

[colors.button.primary]
background = "#2b292f"
foreground = "#e6e0e9"

[colors.button.primary.hover]
background = { name = "#36343a", opacity = 0.85 }

[colors.button.primary.focus]
outline = "colors.core.accent"

# ============================================================================
# Lists
# ============================================================================
# Horizontal list views with elevation-based selection

[colors.list.item.hover]
background = { name = "#2b292f", opacity = 0.7 }
foreground = "#e6e0e9"

[colors.list.item.selection]
background = { name = "#4d3d75", opacity = 0.5 }
foreground = "#e9ddff"
secondary_background = "#4d3d75"
secondary_foreground = "#e9ddff"

# ============================================================================
# Grid Items
# ============================================================================
# Grid layouts (icon grids, tiles) with outline-based selection

[colors.grid.item]
background = "#211f24"

[colors.grid.item.hover]
outline = { name = "#d0bcfe", opacity = 0.6 }

[colors.grid.item.selection]
outline = { name = "#d0bcfe", opacity = 0.9 }

# ============================================================================
# Scrollbars
# ============================================================================
# Subtle scrollbar styling

[colors.scrollbars]
background = { name = "#e6e0e9", opacity = 0.2 }

# ============================================================================
# Loading Indicators
# ============================================================================
# Progress bars and spinners for loading states

[colors.loading]
bar = "#d0bcfe"
spinner = "#d0bcfe"
