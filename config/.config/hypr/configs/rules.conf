# disable animation for vicinae only
layerrule {
    name = vicinae-no-animation
    no_anim = on
    match:namespace = vicinae
}
layerrule {
  name = layerrule-blur
  blur = on
  match:namespace = title: (.*)
}

windowrule {
  name = windowrule-opacity
  opacity = 0.8 override
  match:title = (.*)
}
windowrule {
  name = windowrule-opacity-full-t
  opacity = 1.0 override
  match:title = ^([Mm]inecraft.*)$
}
windowrule {
  name = windowrule-opacity-full-c
  opacity = 1.0 override
