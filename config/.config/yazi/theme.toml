# : Manager [[[

[mgr]
cwd = { fg = "#f0dfd7" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#cece5f", bg = "#cece5f" }
marker_cut      = { fg = "#e6e6ad", bg = "#e6e6ad" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#caca93", bg = "#caca93" }

# Count
count_copied   = { fg = "#1c1d00", bg = "#e6e6ad" }
count_cut      = { fg = "#1c1d00", bg = "#e6e6ad" }
count_selected = { fg = "#512400", bg = "#caca93" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffb688" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffb688", bold = true, bg = "#19120d" }
inactive  = { fg = "#e5bfa9", bg = "#19120d" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#ffb688", fg = "#512400", bold = true }
normal_alt  = { bg = "#52443c", fg = "#d7c3b8" }

# Select mode
select_main = { bg = "#e5bfa9", fg = "#432b1c", bold = true }
select_alt  = { bg = "#52443c", fg = "#d7c3b8" }

# Unset mode
unset_main = { bg = "#caca93", fg = "#32320a", bold = true }
unset_alt  = { bg = "#52443c", fg = "#d7c3b8" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#bc6939" }
perm_write = { fg = "#838341" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#c0c03a" }
perm_sep   = { fg = "#ff792e" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#ffb688", bg = "#413731" }
progress_error  = { fg = "#ffb4ab", bg = "#413731" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#413731" }
cand = { fg = "#ffb688" }
rest = { fg = "#512400" }
desc = { fg = "#f0dfd7" }
separator = " ▶ "
separator_style = { fg = "#f0dfd7" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#caca93" }
title_warn  = { fg = "#ffb688" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffb688" }
active = { fg = "#caca93", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb688" }
value  = { fg = "#f0dfd7" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb688", bg = "#512400" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffb688" }
title   = {}
hovered = { fg = "#e6e6ad", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#f0dfd7" }
run    = { fg = "#f0dfd7" }
footer = { fg = "#432b1c", bg = "#e5bfa9" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#f0dfd7" },
    { url = "*/", fg = "#ffb688" },
]

# : ]]]
