# : Manager [[[

[mgr]
cwd = { fg = "#e9e0e7" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff7972", bg = "#ff7972" }
marker_cut      = { fg = "#ffdad8", bg = "#ffdad8" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f5b7b4", bg = "#f5b7b4" }

# Count
count_copied   = { fg = "#331110", bg = "#ffdad8" }
count_cut      = { fg = "#331110", bg = "#ffdad8" }
count_selected = { fg = "#452153", bg = "#f5b7b4" }

# Border
border_symbol = "│"
border_style  = { fg = "#e5b6f2" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#e5b6f2", bold = true, bg = "#161217" }
inactive  = { fg = "#d5c0d7", bg = "#161217" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#e5b6f2", fg = "#452153", bold = true }
normal_alt  = { bg = "#4c444d", fg = "#cec3cd" }

# Select mode
select_main = { bg = "#d5c0d7", fg = "#392c3d", bold = true }
select_alt  = { bg = "#4c444d", fg = "#cec3cd" }

# Unset mode
unset_main = { bg = "#f5b7b4", fg = "#4c2524", bold = true }
unset_alt  = { bg = "#4c444d", fg = "#cec3cd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#96639b" }
perm_write = { fg = "#e3352d" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff493f" }
perm_sep   = { fg = "#dd3fff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#e5b6f2", bg = "#3d373d" }
progress_error  = { fg = "#ffb4ab", bg = "#3d373d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3d373d" }
cand = { fg = "#e5b6f2" }
rest = { fg = "#452153" }
desc = { fg = "#e9e0e7" }
separator = " ▶ "
separator_style = { fg = "#e9e0e7" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#f5b7b4" }
title_warn  = { fg = "#e5b6f2" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#e5b6f2" }
active = { fg = "#f5b7b4", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#e5b6f2" }
value  = { fg = "#e9e0e7" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#e5b6f2", bg = "#452153" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#e5b6f2" }
title   = {}
hovered = { fg = "#ffdad8", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e9e0e7" }
run    = { fg = "#e9e0e7" }
footer = { fg = "#392c3d", bg = "#d5c0d7" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e9e0e7" },
    { url = "*/", fg = "#e5b6f2" },
]

# : ]]]
