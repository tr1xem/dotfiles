# : Manager [[[

[mgr]
cwd = { fg = "#e3e1e9" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff71d1", bg = "#ff71d1" }
marker_cut      = { fg = "#ffd7f2", bg = "#ffd7f2" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#e5bad8", bg = "#e5bad8" }

# Count
count_copied   = { fg = "#2d1228", bg = "#ffd7f2" }
count_cut      = { fg = "#2d1228", bg = "#ffd7f2" }
count_selected = { fg = "#212c61", bg = "#e5bad8" }

# Border
border_symbol = "│"
border_style  = { fg = "#b9c3ff" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b9c3ff", bold = true, bg = "#121318" }
inactive  = { fg = "#c3c5dd", bg = "#121318" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b9c3ff", fg = "#212c61", bold = true }
normal_alt  = { bg = "#45464f", fg = "#c6c5d0" }

# Select mode
select_main = { bg = "#c3c5dd", fg = "#2c2f42", bold = true }
select_alt  = { bg = "#45464f", fg = "#c6c5d0" }

# Unset mode
unset_main = { bg = "#e5bad8", fg = "#44263e", bold = true }
unset_alt  = { bg = "#45464f", fg = "#c6c5d0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#6167a6" }
perm_write = { fg = "#bb4b99" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff3ec0" }
perm_sep   = { fg = "#445aff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b9c3ff", bg = "#38393f" }
progress_error  = { fg = "#ffb4ab", bg = "#38393f" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#38393f" }
cand = { fg = "#b9c3ff" }
rest = { fg = "#212c61" }
desc = { fg = "#e3e1e9" }
separator = " ▶ "
separator_style = { fg = "#e3e1e9" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#e5bad8" }
title_warn  = { fg = "#b9c3ff" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#b9c3ff" }
active = { fg = "#e5bad8", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#b9c3ff" }
value  = { fg = "#e3e1e9" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#b9c3ff", bg = "#212c61" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#b9c3ff" }
title   = {}
hovered = { fg = "#ffd7f2", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e3e1e9" }
run    = { fg = "#e3e1e9" }
footer = { fg = "#2c2f42", bg = "#c3c5dd" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e3e1e9" },
    { url = "*/", fg = "#b9c3ff" },
]

# : ]]]
