lxc.mount.entry = /home/saumya/dotfiles home/trix/dotfiles none bind,optional,create=dir,ro,idmap=container 0 0
# Essential char devices (needed in unprivileged containers)
lxc.cgroup2.devices.allow = c 1:3 rwm
lxc.cgroup2.devices.allow = c 1:5 rwm
lxc.cgroup2.devices.allow = c 1:8 rwm
lxc.cgroup2.devices.allow = c 1:9 rwm
lxc.cgroup2.devices.allow = c 5:0 rwm
lxc.cgroup2.devices.allow = c 5:2 rwm
# env
lxc.environment = XDG_RUNTIME_DIR=/run/user/1000
