lxc.mount.entry = tmpfs tmp tmpfs defaults
lxc.mount.entry = /dev/dri dev/dri none bind,optional,create=dir
lxc.mount.entry = /dev/snd dev/snd none bind,optional,create=dir
lxc.mount.entry = /tmp/.X11-unix tmp/.X11-unix none bind,optional,create=dir,ro
lxc.mount.entry = /dev/video0 dev/video0 none bind,optional,create=file
lxc.mount.entry = /run/user/1000/pipewire-0 tmp/pipewire-0 none bind,optional,create=file,ro 0 0
lxc.mount.entry = /run/user/1000/pulse/native tmp/pulse-native none bind,optional,create=file,ro 0 0
lxc.environment = PIPEWIRE_REMOTE=unix:/tmp/pipewire-0
lxc.environment = DISPLAY=:0
lxc.environment = PULSE_SERVER=unix:/tmp/pulse-native
